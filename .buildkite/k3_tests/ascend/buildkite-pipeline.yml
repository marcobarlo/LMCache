# Paste this into the Ascend910B Buildkite pipeline's "Steps" editor.
# $$ is required: Buildkite turns it into $ before the agent shell runs.
#
# This step clones an allowlisted base branch and runs that copy of the
# bootstrap. It does not execute shell scripts from the pull request checkout.
# Update the steps editor after this file is on the base branch (dev/main).

agents:
  queue: "Ascend910B"

steps:
  - label: ":pipeline: Upload pipeline"
    command: |
      set -euo pipefail
      base="$${BUILDKITE_PULL_REQUEST_BASE_BRANCH:-$${BUILDKITE_PIPELINE_DEFAULT_BRANCH:-dev}}"
      case "$$base" in
        dev|main|master) ;;
        *)
          echo "Ascend CI: refusing untrusted base branch" >&2
          exit 1
          ;;
      esac
      if [[ -z "$${BUILDKITE_REPO:-}" ]]; then
        echo "Ascend CI: BUILDKITE_REPO is not set" >&2
        exit 1
      fi
      work="$$(mktemp -d)"
      trap 'rm -rf "$$work"' EXIT
      git clone --quiet --depth 1 --branch "$$base" "$$BUILDKITE_REPO" "$$work/src"
      bash "$$work/src/.buildkite/k3_tests/ascend/trusted-bootstrap.sh"
